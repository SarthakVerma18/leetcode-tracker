name: Sync LeetCode progress

on:
  schedule:
    # Every 6 hours. GitHub queues cron jobs, so expect some drift.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "styles.css"
      - "build_site.py"
      - "leetcode_tracker.py"
      - "annotations.json"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the retry below can rebase onto a moved main.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: python build_site.py --ci

      - name: Commit updated snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh LeetCode snapshot"
          # Another run (or a local push) may have moved main in the meantime.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
